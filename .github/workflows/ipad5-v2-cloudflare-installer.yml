name: Dopamine iPad5 16.7.11 v2 Cloudflare installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ipad5-v2-cloudflare-installer.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SOURCE_SHA: fa0776152e9352782c80bf9ee2f7e11809a759db

jobs:
  sign-and-serve:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - name: Checkout signing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download green Dopamine iPad5 v2 IPA
        uses: actions/download-artifact@v4
        with:
          name: Dopamine
          path: unsigned
          github-token: ${{ github.token }}
          repository: NightVibes33/Dopamine
          run-id: 31246332731

      - name: Sign green IPA
        shell: bash
        env:
          P12_PASSWORD: "1"
        run: |
          set -euxo pipefail
          mkdir -p output signing-work
          UNSIGNED_IPA="$(find unsigned -type f -name '*.ipa' -print -quit)"
          test -s "$UNSIGNED_IPA"

          python3 - <<'PY'
          import base64
          from pathlib import Path
          def clean(value: str) -> str:
              value = ''.join(value.split())
              return value + ('=' * (-len(value) % 4))
          Path('signing-work/development.p12').write_bytes(
              base64.b64decode(clean(Path('dopamine/Dopamine-Development.p12.b64').read_text()), validate=True)
          )
          parts = sorted(Path('dopamine/profile.parts').glob('*'))
          if not parts:
              raise SystemExit('Provisioning profile chunks are missing')
          profile_b64 = ''.join(''.join(part.read_text().split()) for part in parts)
          Path('signing-work/profile.mobileprovision').write_bytes(
              base64.b64decode(clean(profile_b64), validate=True)
          )
          PY

          security cms -D -i signing-work/profile.mobileprovision > signing-work/profile.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          profile = plistlib.loads(Path('signing-work/profile.plist').read_bytes())
          entitlements = profile['Entitlements']
          bundle_id = entitlements['application-identifier'].split('.', 1)[1]
          Path('signing-work/entitlements.plist').write_bytes(
              plistlib.dumps(entitlements, fmt=plistlib.FMT_XML, sort_keys=False)
          )
          Path('signing-work/bundle-id.txt').write_text(bundle_id)
          PY

          BUNDLE_ID="$(cat signing-work/bundle-id.txt)"
          KEYCHAIN="$RUNNER_TEMP/dopamine-ipad5-v2.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import signing-work/development.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')"
          test -n "$IDENTITY"

          mkdir -p signing-work/unpacked
          unzip -q "$UNSIGNED_IPA" -d signing-work/unpacked
          APP="$(find signing-work/unpacked/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          cp signing-work/profile.mobileprovision "$APP/embedded.mobileprovision"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf '{}' +

          if [[ -d "$APP/Frameworks" ]]; then
            while IFS= read -r -d '' framework; do
              codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$framework"
            done < <(find "$APP/Frameworks" -depth -type d -name '*.framework' -print0)
          fi
          while IFS= read -r -d '' dylib; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$dylib"
          done < <(find "$APP" -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' extension; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$extension"
          done < <(find "$APP" -depth -type d -name '*.appex' -print0)

          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none \
            --entitlements signing-work/entitlements.plist --generate-entitlement-der "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          (cd signing-work/unpacked && zip -qry "$GITHUB_WORKSPACE/output/Dopamine-iPad5-16.7.11-v2-signed.ipa" Payload)
          test -s output/Dopamine-iPad5-16.7.11-v2-signed.ipa

          python3 - <<PY
          import json
          from pathlib import Path
          Path('output/metadata.json').write_text(json.dumps({
              'bundle_id': '$BUNDLE_ID',
              'version': '$VERSION',
              'build': '$BUILD_NUMBER',
              'title': 'Dopamine iPad 5 16.7.11 v2',
              'source_sha': '$SOURCE_SHA',
          }, indent=2) + '\n')
          PY
          security delete-keychain "$KEYCHAIN"

      - name: Start Cloudflare OTA installer
        id: tunnel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site/complete

          # Seed the origin so it can be health-checked before Cloudflare is started.
          printf '<!doctype html><meta charset="utf-8"><title>Preparing Dopamine OTA</title><p>Preparing installer…</p>\n' > site/complete/index.html

          RUNNER_TRACKING_ID="" nohup python3 -m http.server 8080 --bind 0.0.0.0 --directory "$GITHUB_WORKSPACE/site" > "$GITHUB_WORKSPACE/http-server.log" 2>&1 &
          echo "$!" > server.pid

          # Do not publish a tunnel unless the local origin is genuinely reachable.
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/complete/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/complete/ >/dev/null
          kill -0 "$(cat server.pid)"

          ARCH="$(uname -m)"
          if [[ "$ARCH" == "arm64" ]]; then CF_ARCH=arm64; else CF_ARCH=amd64; fi
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${CF_ARCH}.tgz" -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          chmod +x cloudflared
          RUNNER_TRACKING_ID="" nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > "$GITHUB_WORKSPACE/cloudflared.log" 2>&1 &
          echo "$!" > tunnel.pid

          URL=""
          for _ in $(seq 1 90); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            [[ -n "$URL" ]] && break
            sleep 2
          done
          test -n "$URL"
          kill -0 "$(cat tunnel.pid)"

          RESULT="$(python3 tools/build_dopamine_site.py --site site/complete \
            --ipa output/Dopamine-iPad5-16.7.11-v2-signed.ipa \
            --metadata output/metadata.json --base-url "$URL/complete")"

          # Re-check the exact OTA page locally after generating the final site.
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/complete/ >/dev/null

          INSTALLER_URL="$URL/complete/"
          IPA_URL="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ipa_url"])' <<<"$RESULT")"

          # Verify Cloudflare can actually reach the origin before publishing the URL.
          OK=""
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "$INSTALLER_URL" >/dev/null; then
              OK=1
              break
            fi
            sleep 2
          done
          test -n "$OK"

          printf '%s\n' "$INSTALLER_URL" > cloudflare-installer-url.txt
          printf '%s\n' "$IPA_URL" > cloudflare-ipa-url.txt
          printf '%s\n' "$SOURCE_SHA" > cloudflare-source-sha.txt
          echo "installer_url=$INSTALLER_URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Dopamine iPad5 v2 OTA::$INSTALLER_URL"

      - name: Publish live installer URL
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-installer-url.txt cloudflare-ipa-url.txt cloudflare-source-sha.txt
          git commit -m 'Publish iPad5 v2 Cloudflare OTA URL' || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-iPad5-v2-Cloudflare-URL
          path: |
            cloudflare-installer-url.txt
            cloudflare-ipa-url.txt
          retention-days: 2

      - name: Keep installer online
        shell: bash
        run: |
          set -euxo pipefail
          SERVER_PID="$(cat server.pid)"
          TUNNEL_PID="$(cat tunnel.pid)"
          while kill -0 "$SERVER_PID" 2>/dev/null && kill -0 "$TUNNEL_PID" 2>/dev/null; do
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/complete/ >/dev/null
            sleep 30
          done
          exit 1
