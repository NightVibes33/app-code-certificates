name: Dopamine permanent installer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dopamine-permanent-installer.yml"
      - "dopamine/**"
      - "tools/build_dopamine_site.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dopamine-permanent-installer
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: NightVibes33/Dopamine
  SOURCE_BRANCH: research/ipad5-darksword
  PAGES_BASE_URL: https://nightvibes33.github.io/app-code-certificates

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.state.outputs.changed }}
      source_sha: ${{ steps.state.outputs.source_sha }}
    steps:
      - name: Checkout signing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare current source to published source
        id: state
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [[ -z "$SOURCE_SHA" ]]; then
            echo "::error::Could not resolve ${SOURCE_REPOSITORY}@${SOURCE_BRANCH}"
            exit 1
          fi

          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          PUBLISHED_SHA="$(git show origin/gh-pages:latest/source-sha.txt 2>/dev/null | tr -d '\r\n' || true)"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$SOURCE_SHA" == "$PUBLISHED_SHA" && -n "$PUBLISHED_SHA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source ${SOURCE_SHA:0:12} is already published."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing source ${SOURCE_SHA:0:12}; previous=${PUBLISHED_SHA:-none}."
          fi

  build-sign:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private signing repository
        uses: actions/checkout@v4

      - name: Clone Dopamine StockBaseline source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$SOURCE_BRANCH" --recurse-submodules --shallow-submodules \
            "https://github.com/${SOURCE_REPOSITORY}.git" source
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "${{ needs.check.outputs.source_sha }}" ]]; then
            echo "::error::Source moved during build: expected ${{ needs.check.outputs.source_sha }}, got $ACTUAL_SHA"
            exit 1
          fi

      - name: Apply diagnostic-only iPad 5 patch
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          python3 research/ipad5_darksword_patch.py
          git diff --check
          grep -nE 'diagnostic-only profile|stock DarkSword parameters|upstream target|if \(r < 0\)' Application/Dopamine/Exploits/DarkSword/DarkSword.m
          if grep -nE '0x6000|0xC00|8192, 10240, 12288|tryLimit|isIPad5Device \? 900' Application/Dopamine/Exploits/DarkSword/DarkSword.m; then
            echo '::error::Experimental heap, spray, or race tuning is still present'
            exit 1
          fi
          grep -q 'for (unsigned socketCount = 0; socketCount < (maxfiles - leeway); socketCount++)' Application/Dopamine/Exploits/DarkSword/DarkSword.m
          grep -q 'totalSearchMappingPagesNum = isA18Device ? (0x10 \* 0x10) : (0x1000 \* 0x10)' Application/Dopamine/Exploits/DarkSword/DarkSword.m

      - name: Xcode setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install make libarchive openssl
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install THEOS and SDK
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          export THEOS="$(pwd)/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Build and install trustcache
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set build metadata
        shell: bash
        working-directory: source
        run: |
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "$T2" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=$T2" >> "$GITHUB_ENV"
          echo "ctimestamp=$TS" >> "$GITHUB_ENV"
          echo "shorthash=$SHASH" >> "$GITHUB_ENV"

      - name: Download bootstraps
        shell: bash
        working-directory: source/Application/Dopamine/Resources
        run: |
          set -euxo pipefail
          ./download_bootstraps.sh

      - name: Build StockBaseline IPA
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1
          test -s Application/Dopamine.ipa

      - name: Decode signing assets and sign IPA
        shell: bash
        env:
          P12_PASSWORD: "1"
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
        run: |
          set -euxo pipefail
          mkdir -p output signing-work

          python3 - <<'PY'
          import base64
          from pathlib import Path

          def clean_base64(value: str) -> str:
              value = ''.join(value.split())
              return value + ('=' * (-len(value) % 4))

          p12_text = clean_base64(Path('dopamine/Dopamine-Development.p12.b64').read_text())
          Path('signing-work/development.p12').write_bytes(base64.b64decode(p12_text, validate=True))

          parts = sorted(Path('dopamine/profile.parts').glob('*'))
          if parts:
              profile_text = ''.join(''.join(part.read_text().split()) for part in parts)
              print(f'Joining {len(parts)} provisioning-profile chunks ({len(profile_text)} Base64 characters)')
          else:
              profile_text = Path('dopamine/Dopamine-iPad5.mobileprovision.b64').read_text()

          profile_text = clean_base64(profile_text)
          profile_bytes = base64.b64decode(profile_text, validate=True)
          if not profile_bytes:
              raise SystemExit('Decoded provisioning profile is empty')
          Path('signing-work/profile.mobileprovision').write_bytes(profile_bytes)
          PY

          security cms -D -i signing-work/profile.mobileprovision > signing-work/profile.plist
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          profile = plistlib.loads(Path('signing-work/profile.plist').read_bytes())
          entitlements = profile['Entitlements']
          app_identifier = entitlements['application-identifier']
          bundle_id = app_identifier.split('.', 1)[1]
          Path('signing-work/entitlements.plist').write_bytes(plistlib.dumps(entitlements, fmt=plistlib.FMT_XML, sort_keys=False))
          Path('signing-work/profile-data.json').write_text(json.dumps({'bundle_id': bundle_id}))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'BUNDLE_ID={bundle_id}\n')
          PY

          KEYCHAIN="$RUNNER_TEMP/dopamine-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import signing-work/development.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')"
          test -n "$IDENTITY"

          rm -rf signing-work/unpacked
          mkdir -p signing-work/unpacked
          unzip -q source/Application/Dopamine.ipa -d signing-work/unpacked
          APP="$(find signing-work/unpacked/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          cp signing-work/profile.mobileprovision "$APP/embedded.mobileprovision"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf '{}' +

          if [[ -d "$APP/Frameworks" ]]; then
            while IFS= read -r -d '' framework; do
              codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$framework"
            done < <(find "$APP/Frameworks" -depth -type d -name '*.framework' -print0)
          fi

          while IFS= read -r -d '' dylib; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$dylib"
          done < <(find "$APP" -type f -name '*.dylib' -print0)

          while IFS= read -r -d '' extension; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$extension"
          done < <(find "$APP" -depth -type d -name '*.appex' -print0)

          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none \
            --entitlements signing-work/entitlements.plist --generate-entitlement-der "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          (cd signing-work/unpacked && zip -qry "$GITHUB_WORKSPACE/output/Dopamine-iPad5-StockBaseline-signed.ipa" Payload)
          test -s output/Dopamine-iPad5-StockBaseline-signed.ipa

          python3 - <<PY
          import json
          from pathlib import Path
          metadata = {
              'bundle_id': '$BUNDLE_ID',
              'version': '$VERSION',
              'build': '$BUILD_NUMBER',
              'title': 'Dopamine iPad 5 StockBaseline',
              'source_sha': '$SOURCE_SHA',
          }
          Path('output/metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY

          security delete-keychain "$KEYCHAIN"

      - name: Upload signed site input
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-signed-site-input
          path: output
          if-no-files-found: error
          retention-days: 2

  tunnel:
    needs:
      - check
      - build-sign
    if: needs.check.outputs.changed == 'true' && needs.build-sign.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout installer generator
        uses: actions/checkout@v4

      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: dopamine-signed-site-input
          path: output

      - name: Start Cloudflare installer and build complete page
        id: tunnel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site/complete

          RUNNER_TRACKING_ID="" nohup python3 -m http.server 8080 --directory site > http-server.log 2>&1 &
          echo "$!" > server.pid

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          RUNNER_TRACKING_ID="" nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cloudflared.log 2>&1 &
          echo "$!" > tunnel.pid

          URL=""
          for _ in $(seq 1 90); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            if [[ -n "$URL" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$URL" ]]; then
            cat cloudflared.log
            exit 1
          fi

          RESULT="$(python3 tools/build_dopamine_site.py \
            --site site/complete \
            --ipa output/Dopamine-iPad5-StockBaseline-signed.ipa \
            --metadata output/metadata.json \
            --base-url "$URL/complete")"

          INSTALLER_URL="$URL/complete/"
          IPA_URL="$(jq -r .ipa_url <<<"$RESULT")"
          REGISTRATION_URL="$(jq -r .registration_url <<<"$RESULT")"

          printf '%s\n' "$INSTALLER_URL" > installer-url.txt
          printf '%s\n' "$IPA_URL" > ipa-url.txt
          printf '%s\n' "$REGISTRATION_URL" > registration-url.txt
          cat > installer.webloc <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>URL</key><string>${INSTALLER_URL}</string></dict></plist>
          EOF

          echo "installer_url=$INSTALLER_URL" >> "$GITHUB_OUTPUT"
          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"
          echo "registration_url=$REGISTRATION_URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Dopamine iPad installer::$INSTALLER_URL"

      - name: Upload Cloudflare installer URL
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-iPad5-Cloudflare-Installer-URL
          path: |
            installer-url.txt
            ipa-url.txt
            registration-url.txt
            installer.webloc
          if-no-files-found: error
          retention-days: 2

      - name: Write Cloudflare installer summary
        shell: bash
        run: |
          {
            echo '## Dopamine Cloudflare installer online'
            echo
            echo '- Installer with Start iPad Registration and Install Dopamine Build:'
            echo '  ${{ steps.tunnel.outputs.installer_url }}'
            echo '- Registration:'
            echo '  ${{ steps.tunnel.outputs.registration_url }}'
            echo '- Signed IPA:'
            echo '  ${{ steps.tunnel.outputs.ipa_url }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Cloudflare installer online
        shell: bash
        run: |
          set -euxo pipefail
          SERVER_PID="$(cat server.pid)"
          TUNNEL_PID="$(cat tunnel.pid)"
          while kill -0 "$SERVER_PID" 2>/dev/null && kill -0 "$TUNNEL_PID" 2>/dev/null; do
            sleep 30
          done
          cat http-server.log || true
          cat cloudflared.log || true
          exit 1

  publish:
    needs:
      - check
      - build-sign
    if: needs.check.outputs.changed == 'true' && needs.build-sign.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      unique_url: ${{ steps.site.outputs.unique_url }}
      stable_url: ${{ steps.site.outputs.stable_url }}
    steps:
      - name: Checkout private signing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: dopamine-signed-site-input
          path: output

      - name: Restore current published site
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages | tar -x -C site
          fi

      - name: Generate permanent latest and unique installer URLs
        id: site
        shell: bash
        run: |
          set -euxo pipefail
          RESULT="$(python3 tools/build_dopamine_site.py \
            --site site \
            --ipa output/Dopamine-iPad5-StockBaseline-signed.ipa \
            --metadata output/metadata.json \
            --base-url "$PAGES_BASE_URL")"
          UNIQUE_URL="$(jq -r .unique_url <<<"$RESULT")"
          STABLE_URL="$(jq -r .stable_url <<<"$RESULT")"
          echo "unique_url=$UNIQUE_URL" >> "$GITHUB_OUTPUT"
          echo "stable_url=$STABLE_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$UNIQUE_URL" > installer-url.txt
          printf '%s\n' "$STABLE_URL" > stable-installer-url.txt
          cat > installer.webloc <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>URL</key><string>${UNIQUE_URL}</string></dict></plist>
          EOF

      - name: Rewrite gh-pages as a compact current snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf publish-repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish-repo
          cd publish-repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --orphan gh-pages-rewrite
          git rm -rf . 2>/dev/null || true
          cp -a ../site/. .
          git add -A
          git commit -m "Publish Dopamine installer ${{ needs.check.outputs.source_sha }}"
          git push origin HEAD:gh-pages --force

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload installer URL files
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-permanent-installer-url
          path: |
            installer-url.txt
            stable-installer-url.txt
            installer.webloc
          retention-days: 30

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo '## Dopamine installer published'
            echo
            echo "- Latest permanent URL: ${{ steps.site.outputs.stable_url }}"
            echo "- New unique URL: ${{ steps.site.outputs.unique_url }}"
            echo "- Source: ${{ needs.check.outputs.source_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy permanent installer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
