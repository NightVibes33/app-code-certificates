name: Current runs probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/current-runs-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" | jq '[.workflow_runs[] | {id,name,status,conclusion,head_sha,event,created_at,html_url}]' > current-runs.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add current-runs.json
          git commit -m 'Refresh current workflow runs'
          git pull --rebase origin main
          git push origin main

# Check apply-cloudflare runner status
