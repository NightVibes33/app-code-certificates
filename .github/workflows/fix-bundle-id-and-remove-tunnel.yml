name: Fix bundle ID and remove temporary tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-bundle-id-and-remove-tunnel.yml"

permissions:
  actions: write
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch permanent publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/dopamine-permanent-installer.yml')
          lines = path.read_text().splitlines()

          # Make the parsed bundle ID available inside this same shell step.
          marker = "              env.write(f'BUNDLE_ID={bundle_id}\\n')"
          marker_index = next(i for i, line in enumerate(lines) if line == marker)
          heredoc_end = next(i for i in range(marker_index + 1, len(lines)) if lines[i].strip() == 'PY')
          assignment = [
              '',
              "          BUNDLE_ID=\"$(python3 -c 'import json; print(json.load(open(\"signing-work/profile-data.json\"))[\"bundle_id\"])')\"",
              '          export BUNDLE_ID',
          ]
          if not any('profile-data.json' in line and 'BUNDLE_ID=' in line for line in lines[heredoc_end + 1:heredoc_end + 8]):
              lines[heredoc_end + 1:heredoc_end + 1] = assignment

          # Static GitHub Pages is permanent; remove the temporary six-hour tunnel job.
          if '  tunnel:' in lines:
              tunnel_start = lines.index('  tunnel:')
              publish_start = next(i for i in range(tunnel_start + 1, len(lines)) if lines[i] == '  publish:')
              del lines[tunnel_start:publish_start]

          text = '\n'.join(lines) + '\n'
          text = text.replace('cron: "17 * * * *"', 'cron: "*/15 * * * *"')
          path.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/dopamine-permanent-installer.yml
          git rm -f .github/workflows/fix-bundle-id-and-remove-tunnel.yml
          git rm -f .github/workflows/fix-permanent-installer-signing.yml || true
          git rm -f .github/workflows/fix-permanent-installer-signing-v2.yml || true
          git commit -m 'Fix signing bundle ID and keep installer permanent'
          git pull --rebase origin main
          git push

      - name: Start corrected permanent build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dopamine-permanent-installer.yml/dispatches" \
            -f ref=main
