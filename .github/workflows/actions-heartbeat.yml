name: Actions heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-heartbeat.yml"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record Actions heartbeat
        shell: bash
        run: |
          set -euo pipefail
          printf 'Actions operational at %s\nRun: %s\nCommit: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_RUN_ID" "$GITHUB_SHA" > automation-heartbeat.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation-heartbeat.txt
          git commit -m 'Record Actions heartbeat'
          git push
