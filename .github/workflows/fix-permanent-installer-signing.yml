name: Fix permanent installer signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-permanent-installer-signing.yml"

permissions:
  actions: write
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch verified signing-asset reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/dopamine-permanent-installer.yml')
          text = path.read_text()
          old = """          python3 - <<'PY'\n          import base64\n          from pathlib import Path\n          Path('signing-work/development.p12').write_bytes(base64.b64decode(Path('dopamine/Dopamine-Development.p12.b64').read_text().strip()))\n          Path('signing-work/profile.mobileprovision').write_bytes(base64.b64decode(Path('dopamine/Dopamine-iPad5.mobileprovision.b64').read_text().strip()))\n          PY\n"""
          new = """          python3 - <<'PY'\n          import base64\n          import hashlib\n          from pathlib import Path\n\n          def decode_verified(encoded: str, expected_sha256: str) -> bytes:\n              compact = ''.join(encoded.split())\n              decoded = base64.b64decode(compact, validate=True)\n              actual = hashlib.sha256(decoded).hexdigest()\n              if actual != expected_sha256:\n                  raise RuntimeError(f'signing asset hash mismatch: {actual}')\n              return decoded\n\n          p12_b64 = Path('dopamine/Dopamine-Development.p12.b64').read_text()\n          profile_b64 = ''.join(\n              (Path('dopamine/profile.parts') / f'{index:02d}').read_text()\n              for index in range(1, 6)\n          )\n          Path('signing-work/development.p12').write_bytes(\n              decode_verified(p12_b64, 'fb41f3b5fc0042dc7e76d60e1a38d969ebdb533d8c1cbf9f0d51a176e70ee1ea')\n          )\n          Path('signing-work/profile.mobileprovision').write_bytes(\n              decode_verified(profile_b64, 'ffd2413bfd0af85621b15781d2849c1f28f55cee7e484fbd8325d1ef9a5e7aa3')\n          )\n          PY\n"""
          if old not in text:
              raise SystemExit('expected signing decode block was not found')
          text = text.replace(old, new, 1)
          text = text.replace('cron: "17 * * * *"', 'cron: "*/15 * * * *"', 1)
          path.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/dopamine-permanent-installer.yml
          git rm .github/workflows/fix-permanent-installer-signing.yml
          git commit -m 'Fix verified profile reconstruction for permanent installer'
          git push

      - name: Start corrected permanent installer build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dopamine-permanent-installer.yml/dispatches" \
            -f ref=main
