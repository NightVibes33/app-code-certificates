name: Bundle export fixer error probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bundle-fix-error-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/88417351085/logs" > bundle-fix.log
          tail -n 80 bundle-fix.log > bundle-fix-error-tail.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bundle-fix-error-tail.txt
          git commit -m 'Record bundle export fixer error'
          git push
