name: Fix registration server environment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-registration-venv.yml"
      - "tools/fix_registration_venv.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch registration runner
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/fix_registration_venv.py
          git diff --check
          grep -q 'registration-venv/bin/python' .github/workflows/dopamine-main-stable-installer.yml

      - name: Publish patched workflow through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          PATH_NAME='.github/workflows/dopamine-main-stable-installer.yml'
          CONTENT="$(base64 < "$PATH_NAME" | tr -d '\n')"
          for attempt in 1 2 3 4 5; do
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=main" --jq .sha)"
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" \
              -f message='Run registration server in a virtual environment' \
              -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
