name: Fix registration server environment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-registration-venv.yml"
      - "tools/fix_registration_venv.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch registration runner
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/fix_registration_venv.py
          git diff --check
          grep -q 'registration-venv/bin/python' .github/workflows/dopamine-main-stable-installer.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/dopamine-main-stable-installer.yml
          git rm .github/workflows/fix-registration-venv.yml
          git rm tools/fix_registration_venv.py
          git commit -m 'Run registration server in a virtual environment'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
