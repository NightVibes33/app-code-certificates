name: Signing error probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/signing-error-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract failed signing log tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "88414658818"
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > job.log
          {
            echo "Job: ${JOB_ID}"
            echo "Extracted: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            tail -n 500 job.log
          } > signing-error-tail.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add signing-error-tail.txt
          git commit -m 'Refresh signing error tail'
          git push
