name: Dopamine profile registration OTA installer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 */4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dopamine-main-stable-installer.yml"
      - "tools/build_dopamine_site.py"
      - "tools/dopamine_registration_server.py"

permissions:
  actions: read
  contents: write

env:
  SOURCE_REPOSITORY: NightVibes33/Dopamine
  SOURCE_BRANCH: ipad5-16.7.11-v2

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.state.outputs.build_needed }}
      serve_needed: ${{ steps.state.outputs.serve_needed }}
      source_sha: ${{ steps.state.outputs.source_sha }}
      artifact_run_id: ${{ steps.state.outputs.artifact_run_id }}
    steps:
      - name: Checkout signing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check newest Dopamine main commit
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [[ -z "$SOURCE_SHA" ]]; then
            echo "::error::Could not resolve ${SOURCE_REPOSITORY}@${SOURCE_BRANCH}"
            exit 1
          fi

          PUBLISHED_SHA="$(cat cloudflare-source-sha.txt 2>/dev/null | tr -d '\r\n' || true)"
          ARTIFACT_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=dopamine-main-signed-site-input&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' 2>/dev/null || true)"

          BUILD_NEEDED=false
          SERVE_NEEDED=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BUILD_NEEDED=true
          elif [[ -z "$PUBLISHED_SHA" || "$SOURCE_SHA" != "$PUBLISHED_SHA" ]]; then
            BUILD_NEEDED=true
          elif [[ -z "$ARTIFACT_RUN_ID" ]]; then
            BUILD_NEEDED=true
          elif [[ "$EVENT_SCHEDULE" == "7 */4 * * *" ]]; then
            BUILD_NEEDED=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            SERVE_NEEDED=true
          fi

          if [[ "$BUILD_NEEDED" == "true" ]]; then
            SERVE_NEEDED=true
          fi

          echo "build_needed=$BUILD_NEEDED" >> "$GITHUB_OUTPUT"
          echo "serve_needed=$SERVE_NEEDED" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=$ARTIFACT_RUN_ID" >> "$GITHUB_OUTPUT"

  build-sign:
    needs: check
    if: needs.check.outputs.build_needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private signing repository
        uses: actions/checkout@v4

      - name: Clone newest Dopamine main
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$SOURCE_BRANCH" --recurse-submodules --shallow-submodules \
            "https://github.com/${SOURCE_REPOSITORY}.git" source
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "${{ needs.check.outputs.source_sha }}" ]]; then
            echo "::error::Source moved during build: expected ${{ needs.check.outputs.source_sha }}, got $ACTUAL_SHA"
            exit 1
          fi

      - name: Apply iPad 5 diagnostic patch
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          python3 research/ipad5_darksword_patch.py
          git diff --check

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install make libarchive openssl
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install THEOS and SDK
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          export THEOS="$(pwd)/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Build and install trustcache
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set build metadata
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "$T2" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=$T2" >> "$GITHUB_ENV"
          echo "ctimestamp=$TS" >> "$GITHUB_ENV"
          echo "shorthash=$SHASH" >> "$GITHUB_ENV"

      - name: Download bootstraps
        shell: bash
        working-directory: source/Application/Dopamine/Resources
        run: |
          set -euxo pipefail
          ./download_bootstraps.sh

      - name: Build newest IPA
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1
          test -s Application/Dopamine.ipa

      - name: Sign newest IPA
        shell: bash
        env:
          P12_PASSWORD: "1"
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
        run: |
          set -euxo pipefail
          mkdir -p output signing-work
          python3 - <<'PY'
          import base64
          from pathlib import Path
          def clean(value: str) -> str:
              value = ''.join(value.split())
              return value + ('=' * (-len(value) % 4))
          Path('signing-work/development.p12').write_bytes(
              base64.b64decode(clean(Path('dopamine/Dopamine-Development.p12.b64').read_text()), validate=True)
          )
          parts = sorted(Path('dopamine/profile.parts').glob('*'))
          profile_b64 = ''.join(''.join(part.read_text().split()) for part in parts) if parts else Path('dopamine/Dopamine-iPad5.mobileprovision.b64').read_text()
          Path('signing-work/profile.mobileprovision').write_bytes(base64.b64decode(clean(profile_b64), validate=True))
          PY

          security cms -D -i signing-work/profile.mobileprovision > signing-work/profile.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          profile = plistlib.loads(Path('signing-work/profile.plist').read_bytes())
          entitlements = profile['Entitlements']
          bundle_id = entitlements['application-identifier'].split('.', 1)[1]
          Path('signing-work/entitlements.plist').write_bytes(plistlib.dumps(entitlements, fmt=plistlib.FMT_XML, sort_keys=False))
          Path('signing-work/bundle-id.txt').write_text(bundle_id)
          PY

          BUNDLE_ID="$(cat signing-work/bundle-id.txt)"
          KEYCHAIN="$RUNNER_TEMP/dopamine-main-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import signing-work/development.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')"
          test -n "$IDENTITY"

          mkdir -p signing-work/unpacked
          unzip -q source/Application/Dopamine.ipa -d signing-work/unpacked
          APP="$(find signing-work/unpacked/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          cp signing-work/profile.mobileprovision "$APP/embedded.mobileprovision"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf '{}' +
          if [[ -d "$APP/Frameworks" ]]; then
            while IFS= read -r -d '' framework; do codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$framework"; done < <(find "$APP/Frameworks" -depth -type d -name '*.framework' -print0)
          fi
          while IFS= read -r -d '' dylib; do codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$dylib"; done < <(find "$APP" -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' extension; do codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$extension"; done < <(find "$APP" -depth -type d -name '*.appex' -print0)
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none --entitlements signing-work/entitlements.plist --generate-entitlement-der "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          (cd signing-work/unpacked && zip -qry "$GITHUB_WORKSPACE/output/Dopamine-iPad5-newest-signed.ipa" Payload)

          python3 - <<PY
          import json
          from pathlib import Path
          Path('output/metadata.json').write_text(json.dumps({
              'bundle_id': '$BUNDLE_ID',
              'version': '$VERSION',
              'build': '$BUILD_NUMBER',
              'title': 'Dopamine iPad 5',
              'source_sha': '$SOURCE_SHA',
          }, indent=2) + '\n')
          PY
          security delete-keychain "$KEYCHAIN"

      - name: Upload signed installer input
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-main-signed-site-input
          path: output
          if-no-files-found: error
          retention-days: 2

  tunnel:
    needs:
      - check
      - build-sign
    if: always() && needs.check.outputs.serve_needed == 'true' && (needs.build-sign.result == 'success' || needs.build-sign.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 270
    concurrency:
      group: dopamine-main-cloudflare-live
      cancel-in-progress: true
    steps:
      - name: Checkout registration server
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download newly built signed IPA
        if: needs.check.outputs.build_needed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dopamine-main-signed-site-input
          path: output

      - name: Download latest existing signed IPA
        if: needs.check.outputs.build_needed != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dopamine-main-signed-site-input
          path: output
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.check.outputs.artifact_run_id }}

      - name: Prepare automatic registration signing server
        env:
          P12_PASSWORD: "1"
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv registration-venv
          registration-venv/bin/python -m pip install --upgrade pip
          registration-venv/bin/python -m pip install PyJWT cryptography
          echo "REGISTRATION_PYTHON=$GITHUB_WORKSPACE/registration-venv/bin/python" >> "$GITHUB_ENV"
          mkdir -p registration-signing site/complete
          cp output/Dopamine-iPad5-newest-signed.ipa registration-signing/base.ipa
          python3 - <<'PY'
          import base64
          from pathlib import Path
          value = ''.join(Path('dopamine/Dopamine-Development.p12.b64').read_text().split())
          value += '=' * (-len(value) % 4)
          Path('registration-signing/development.p12').write_bytes(base64.b64decode(value))
          PY
          KEYCHAIN="$RUNNER_TEMP/dopamine-registration.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 18000 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import registration-signing/development.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')"
          test -n "$IDENTITY"
          echo "REGISTRATION_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "REGISTRATION_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Start Cloudflare profile registration and OTA installer
        id: tunnel
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          BUNDLE_ID="$(jq -r .bundle_id output/metadata.json)"
          VERSION="$(jq -r .version output/metadata.json)"
          TITLE="$(jq -r .title output/metadata.json)"

          RUNNER_TRACKING_ID="" nohup "$REGISTRATION_PYTHON" tools/dopamine_registration_server.py \
            --site site/complete \
            --base-ipa registration-signing/base.ipa \
            --bundle-id "$BUNDLE_ID" \
            --version "$VERSION" \
            --title "$TITLE" \
            --identity "$REGISTRATION_IDENTITY" \
            --keychain "$REGISTRATION_KEYCHAIN" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-url-file "$GITHUB_WORKSPACE/cloudflare-base-url.txt" \
            > registration-server.log 2>&1 &
          echo "$!" > server.pid

          ARCH="$(uname -m)"
          if [[ "$ARCH" == "arm64" ]]; then CF_ARCH=arm64; else CF_ARCH=amd64; fi
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${CF_ARCH}.tgz" -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          chmod +x cloudflared
          RUNNER_TRACKING_ID="" nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cloudflared.log 2>&1 &
          echo "$!" > tunnel.pid

          URL=""
          for _ in $(seq 1 90); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            [[ -n "$URL" ]] && break
            sleep 2
          done
          test -n "$URL"
          printf '%s\n' "$URL" > cloudflare-base-url.txt

          RESULT="$(python3 tools/build_dopamine_site.py \
            --site site/complete \
            --ipa output/Dopamine-iPad5-newest-signed.ipa \
            --metadata output/metadata.json \
            --base-url "$URL/complete")"
          INSTALLER_URL="$URL/complete/"
          IPA_URL="$(jq -r .ipa_url <<<"$RESULT")"
          REGISTRATION_URL="$(jq -r .registration_url <<<"$RESULT")"
          SOURCE_SHA="$(jq -r .source_sha output/metadata.json)"
          printf '%s\n' "$INSTALLER_URL" > cloudflare-installer-url.txt
          printf '%s\n' "$IPA_URL" > cloudflare-ipa-url.txt
          printf '%s\n' "$REGISTRATION_URL" > cloudflare-registration-url.txt
          printf '%s\n' "$SOURCE_SHA" > cloudflare-source-sha.txt
          echo "installer_url=$INSTALLER_URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Dopamine profile registration installer::$INSTALLER_URL"

      - name: Record current Cloudflare links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          update_file() {
            local path="$1" content sha
            content="$(base64 < "$path" | tr -d '\n')"
            for attempt in 1 2 3 4 5; do
              sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha 2>/dev/null || true)"
              if [[ -n "$sha" ]]; then
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="Update current Dopamine registration installer" -f content="$content" -f branch=main -f sha="$sha" >/dev/null && return 0
              else
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="Record current Dopamine registration installer" -f content="$content" -f branch=main >/dev/null && return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }
          update_file cloudflare-installer-url.txt
          update_file cloudflare-ipa-url.txt
          update_file cloudflare-registration-url.txt
          update_file cloudflare-source-sha.txt

      - name: Upload installer links
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-profile-registration-installer-links
          path: |
            cloudflare-installer-url.txt
            cloudflare-ipa-url.txt
            cloudflare-registration-url.txt
            cloudflare-source-sha.txt
          retention-days: 2

      - name: Keep registration installer online
        shell: bash
        run: |
          set -euxo pipefail
          SERVER_PID="$(cat server.pid)"
          TUNNEL_PID="$(cat tunnel.pid)"
          for _ in $(seq 1 530); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null || ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              cat registration-server.log || true
              cat cloudflared.log || true
              exit 1
            fi
            sleep 30
          done
          exit 0