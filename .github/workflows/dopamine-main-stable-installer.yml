name: Dopamine main stable installer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dopamine-main-stable-installer.yml"
      - "dopamine/**"
      - "tools/build_dopamine_site.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dopamine-main-stable-installer
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: NightVibes33/Dopamine
  SOURCE_BRANCH: main
  PAGES_BASE_URL: https://nightvibes33.github.io/app-code-certificates

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.state.outputs.changed }}
      source_sha: ${{ steps.state.outputs.source_sha }}
    steps:
      - name: Checkout signing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check newest Dopamine main commit
        id: state
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [[ -z "$SOURCE_SHA" ]]; then
            echo "::error::Could not resolve ${SOURCE_REPOSITORY}@${SOURCE_BRANCH}"
            exit 1
          fi

          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          PUBLISHED_SHA="$(git show origin/gh-pages:complete/latest/source-sha.txt 2>/dev/null | tr -d '\r\n' || true)"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced publisher refresh for ${SOURCE_SHA:0:12}."
          elif [[ "$SOURCE_SHA" == "$PUBLISHED_SHA" && -n "$PUBLISHED_SHA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Newest main commit ${SOURCE_SHA:0:12} is already published."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing ${SOURCE_SHA:0:12}; previous=${PUBLISHED_SHA:-none}."
          fi

  build-sign:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private signing repository
        uses: actions/checkout@v4

      - name: Clone newest Dopamine main
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$SOURCE_BRANCH" --recurse-submodules --shallow-submodules \
            "https://github.com/${SOURCE_REPOSITORY}.git" source
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "${{ needs.check.outputs.source_sha }}" ]]; then
            echo "::error::Source moved during build: expected ${{ needs.check.outputs.source_sha }}, got $ACTUAL_SHA"
            exit 1
          fi

      - name: Apply iPad 5 diagnostic patch
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          python3 research/ipad5_darksword_patch.py
          git diff --check

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install make libarchive openssl
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install THEOS and SDK
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          export THEOS="$(pwd)/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Build and install trustcache
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set build metadata
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "$T2" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=$T2" >> "$GITHUB_ENV"
          echo "ctimestamp=$TS" >> "$GITHUB_ENV"
          echo "shorthash=$SHASH" >> "$GITHUB_ENV"

      - name: Download bootstraps
        shell: bash
        working-directory: source/Application/Dopamine/Resources
        run: |
          set -euxo pipefail
          ./download_bootstraps.sh

      - name: Build newest IPA
        shell: bash
        working-directory: source
        run: |
          set -euxo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1
          test -s Application/Dopamine.ipa

      - name: Sign newest IPA
        shell: bash
        env:
          P12_PASSWORD: "1"
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
        run: |
          set -euxo pipefail
          mkdir -p output signing-work

          python3 - <<'PY'
          import base64
          from pathlib import Path

          def clean(value: str) -> str:
              value = ''.join(value.split())
              return value + ('=' * (-len(value) % 4))

          Path('signing-work/development.p12').write_bytes(
              base64.b64decode(clean(Path('dopamine/Dopamine-Development.p12.b64').read_text()), validate=True)
          )
          parts = sorted(Path('dopamine/profile.parts').glob('*'))
          if parts:
              profile_b64 = ''.join(''.join(part.read_text().split()) for part in parts)
          else:
              profile_b64 = Path('dopamine/Dopamine-iPad5.mobileprovision.b64').read_text()
          Path('signing-work/profile.mobileprovision').write_bytes(
              base64.b64decode(clean(profile_b64), validate=True)
          )
          PY

          security cms -D -i signing-work/profile.mobileprovision > signing-work/profile.plist
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          profile = plistlib.loads(Path('signing-work/profile.plist').read_bytes())
          entitlements = profile['Entitlements']
          bundle_id = entitlements['application-identifier'].split('.', 1)[1]
          Path('signing-work/entitlements.plist').write_bytes(
              plistlib.dumps(entitlements, fmt=plistlib.FMT_XML, sort_keys=False)
          )
          Path('signing-work/bundle-id.txt').write_text(bundle_id)
          Path('signing-work/profile-data.json').write_text(json.dumps({'bundle_id': bundle_id}))
          PY

          BUNDLE_ID="$(cat signing-work/bundle-id.txt)"
          export BUNDLE_ID
          KEYCHAIN="$RUNNER_TEMP/dopamine-main-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import signing-work/development.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')"
          test -n "$IDENTITY"

          rm -rf signing-work/unpacked
          mkdir -p signing-work/unpacked
          unzip -q source/Application/Dopamine.ipa -d signing-work/unpacked
          APP="$(find signing-work/unpacked/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          cp signing-work/profile.mobileprovision "$APP/embedded.mobileprovision"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf '{}' +

          if [[ -d "$APP/Frameworks" ]]; then
            while IFS= read -r -d '' framework; do
              codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$framework"
            done < <(find "$APP/Frameworks" -depth -type d -name '*.framework' -print0)
          fi
          while IFS= read -r -d '' dylib; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$dylib"
          done < <(find "$APP" -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' extension; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$extension"
          done < <(find "$APP" -depth -type d -name '*.appex' -print0)

          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none \
            --entitlements signing-work/entitlements.plist --generate-entitlement-der "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          (cd signing-work/unpacked && zip -qry "$GITHUB_WORKSPACE/output/Dopamine-iPad5-newest-signed.ipa" Payload)
          test -s output/Dopamine-iPad5-newest-signed.ipa

          python3 - <<PY
          import json
          from pathlib import Path
          Path('output/metadata.json').write_text(json.dumps({
              'bundle_id': '$BUNDLE_ID',
              'version': '$VERSION',
              'build': '$BUILD_NUMBER',
              'title': 'Dopamine iPad 5',
              'source_sha': '$SOURCE_SHA',
          }, indent=2) + '\n')
          PY
          security delete-keychain "$KEYCHAIN"

      - name: Upload signed installer input
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-main-signed-site-input
          path: output
          if-no-files-found: error
          retention-days: 2

  publish:
    needs:
      - check
      - build-sign
    if: needs.check.outputs.changed == 'true' && needs.build-sign.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      stable_url: ${{ steps.site.outputs.stable_url }}
      ipa_url: ${{ steps.site.outputs.ipa_url }}
    steps:
      - name: Checkout installer generator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed newest IPA
        uses: actions/download-artifact@v4
        with:
          name: dopamine-main-signed-site-input
          path: output

      - name: Generate stable complete website
        id: site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site/complete
          RESULT="$(python3 tools/build_dopamine_site.py \
            --site site/complete \
            --ipa output/Dopamine-iPad5-newest-signed.ipa \
            --metadata output/metadata.json \
            --base-url "$PAGES_BASE_URL/complete")"
          STABLE_URL="$(jq -r .stable_url <<<"$RESULT")"
          IPA_URL="$(jq -r .ipa_url <<<"$RESULT")"
          REGISTRATION_URL="$(jq -r .registration_url <<<"$RESULT")"
          echo "stable_url=$STABLE_URL" >> "$GITHUB_OUTPUT"
          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$STABLE_URL" > site/installer-url.txt
          printf '%s\n' "$IPA_URL" > site/ipa-url.txt
          printf '%s\n' "$REGISTRATION_URL" > site/registration-url.txt
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./complete/"><title>Opening Dopamine installer</title></head><body><p><a href="./complete/">Open the newest Dopamine installer</a></p><script>location.replace('./complete/');</script></body></html>
          HTML

      - name: Publish current snapshot to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf publish-repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish-repo
          cd publish-repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --orphan gh-pages-current
          git rm -rf . 2>/dev/null || true
          cp -a ../site/. .
          git add -A
          git commit -m "Publish newest Dopamine main ${{ needs.check.outputs.source_sha }}"
          git push origin HEAD:gh-pages --force

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload installer links
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-main-stable-installer-links
          path: |
            site/installer-url.txt
            site/ipa-url.txt
            site/registration-url.txt
          retention-days: 30

      - name: Write publisher summary
        shell: bash
        run: |
          {
            echo '## Newest Dopamine main installer published'
            echo
            echo '- Stable website: ${{ steps.site.outputs.stable_url }}'
            echo '- Signed IPA: ${{ steps.site.outputs.ipa_url }}'
            echo '- Source: ${{ needs.check.outputs.source_sha }}'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy stable complete installer
        id: deployment
        uses: actions/deploy-pages@v4
