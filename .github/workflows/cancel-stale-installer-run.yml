name: Cancel stale installer run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-installer-run.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete pre-fix build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/29760371973/cancel" || true
